name: ReviewFlow AI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

env:
  REVIEWFLOW_CONFIG: reviewflow.config.example.yml

jobs:
  ai-review:
    name: AI PR pre-review
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run tests
        run: |
          python -m pytest

      - name: Generate PR diff
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=50
          git diff "origin/${{ github.base_ref }}...HEAD" > pr.diff

      - name: Run ReviewFlow AI
        run: |
          python -m reviewflow.cli run \
            --event-path "$GITHUB_EVENT_PATH" \
            --diff-path pr.diff \
            --config "$REVIEWFLOW_CONFIG" \
            --output-dir .reviewflow \
            --dry-run

      - name: Upload ReviewFlow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reviewflow-ai-report
          path: .reviewflow/

      # Enable this in a later milestone after validating permissions and fork PR behavior.
